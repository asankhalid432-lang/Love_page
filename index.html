<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>خێزانی ئازیزم</title>
    <style>
        body {
            background: #0f0f1a;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        h1 { color: #fff; margin-bottom: 30px; font-size: 24px; }
        ul { list-style: none; padding: 0; }
        
        li {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
            opacity: 0;
            animation: slideDown 1s forwards, colorChange 3s infinite;
        }

        /* جوڵەی هاتنە خوارەوە */
        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* گۆڕینی ڕەنگەکان بەردەوام */
        @keyframes colorChange {
            0% { color: #ff758c; }
            33% { color: #8bc34a; }
            66% { color: #03a9f4; }
            100% { color: #ffeb3b; }
        }

        li:nth-child(1) { animation-delay: 0.5s; }
        li:nth-child(2) { animation-delay: 1.0s; }
        li:nth-child(3) { animation-delay: 1.5s; }
        li:nth-child(4) { animation-delay: 2.0s; }
        li:nth-child(5) { animation-delay: 2.5s; }
        li:nth-child(6) { animation-delay: 3.0s; }
    </style>
</head>
<body>

    <div>
        <h1>✨ خێزانی ئازیزم ✨</h1>
        <ul>
            <li>دایە گیان</li>
            <li>باوە گیان</li>
            <li>خاڵە دابان</li>
            <li>پورە ئاڤان</li>
            <li>خاڵە دییار</li>
            <li>دادە لاڤە</li>
        </ul>
    </div>

    <!-- موزیکی ئارام -->
    <audio autoplay loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

</body>
</html>
