<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ڕۆژی لەدایک بونی ئازیزەکانم</title>
    <style>
        body {
            background: linear-gradient(180deg, #05051a, #0b1d3a, #102a45);
            font-family: 'Tahoma', sans-serif;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* مانگی گەورەی ناوەڕاست بە پەڵەکانەوە */
        .moon {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e0e0e0 60%, #b0b0b0 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.8), inset -12px -12px 20px rgba(0,0,0,0.25);
            z-index: 1;
        }
        /* پەڵەکانی مانگ */
        .moon::after {
            content: "";
            position: absolute;
            top: 25px;
            left: 30px;
            width: 30px;
            height: 25px;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 50% 40% 60% 40%;
            box-shadow: 25px 20px 0 5px rgba(0, 0, 0, 0.1), 10px 35px 0 2px rgba(0, 0, 0, 0.08);
        }

        /* کەنار دەریا لە خوارەوە */
        .sea-shore {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(0deg, #023e8a, #0077b6, rgba(0,119,182,0.4));
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
            box-shadow: 0 -5px 25px rgba(0, 119, 182, 0.6);
            z-index: 2;
        }

        /* ئەستێرەی مۆر و سپی (بازنەیی، چوارگۆشە، لاکێشە) */
        .star {
            position: absolute;
            z-index: 1;
            animation: twinkleStar 3s infinite alternate;
        }
        @keyframes twinkleStar {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* دڵۆپی زۆری باران */
        .raindrop {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: rainFall linear infinite;
        }
        @keyframes rainFall {
            0% { transform: translateY(-30px); }
            100% { transform: translateY(105vh); }
        }

        .center-box {
            position: absolute;
            top: 155px;
            z-index: 10;
            text-align: center;
            width: 90%;
        }
        h1 {
            color: #7ef9ff;
            font-size: 19px;
            text-shadow: 0 0 15px rgba(126, 249, 255, 0.8);
            line-height: 1.5;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            background: #ff3366;
            color: white;
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255,51,102,0.5);
        }

        /* ناوەکان بەهێواشی دێنە خوارەوە و دەجووڵێن */
        .item-container {
            position: absolute;
            text-align: center;
            z-index: 5;
            animation: slowDownRandom 4s ease-out forwards, floatSide 5s ease-in-out infinite alternate;
        }
        .name {
            font-size: 30px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 20px #ff3366, 0 0 35px #ff6b81;
        }
        .date {
            font-size: 16px;
            color: #ffd700;
            margin-top: 2px;
            text-shadow: 0 0 10px rgba(255,215,0,0.8);
        }

        @keyframes slowDownRandom {
            0% { transform: translateY(-120px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes floatSide {
            0% { transform: translateX(0px); }
            100% { transform: translateX(15px); }
        }

        /* شوێنی نیشتەجێبوونی ناوەکان بەهەڕەمەکی و لێک نزیک */
        .pos1 { top: 38%; left: 18%; animation-delay: 0.2s, 0s; }
        .pos2 { top: 38%; right: 18%; animation-delay: 0.5s, 1s; }
        .pos3 { top: 57%; left: 22%; animation-delay: 0.8s, 2s; }
        .pos4 { top: 57%; right: 22%; animation-delay: 1.1s, 1.5s; }
        .pos5 { top: 74%; left: 25%; animation-delay: 1.4s, 0.5s; }
        .pos6 { top: 74%; right: 25%; animation-delay: 1.7s, 2.2s; }
    </style>
</head>
<body>

    <!-- مانگی گەورە -->
    <div class="moon"></div>

    <!-- ئەستێرە سپی و مۆرەکان (بازنەیی، چوارگۆشە، لاکێشە) -->
    <div class="star" style="top: 5%; left: 10%; width: 3px; height: 3px; background: #fff; border-radius: 50%;"></div>
    <div class="star" style="top: 12%; left: 25%; width: 6px; height: 6px; background: #b19cd9;"></div> <!-- چوارگۆشەی مۆر -->
    <div class="star" style="top: 8%; right: 15%; width: 8px; height: 4px; background: #fff;"></div> <!-- لاکێشەی سپی -->
    <div class="star" style="top: 22%; right: 28%; width: 4px; height: 4px; background: #dcd0ff; border-radius: 50%;"></div>
    <div class="star" style="top: 30%; left: 8%; width: 10px; height: 5px; background: #9b59b6;"></div> <!-- لاکێشەی مۆر -->
    <div class="star" style="top: 18%; left: 45%; width: 5px; height: 5px; background: #fff;"></div>
    <div class="star" style="top: 25%; right: 10%; width: 6px; height: 6px; background: #e8daef;"></div>
    <div class="star" style="top: 45%; left: 5%; width: 7px; height: 7px; background: #8e44ad;"></div>
    <div class="star" style="top: 50%; right: 8%; width: 4px; height: 10px; background: #fff;"></div> <!-- لاکێشە -->

    <!-- دڵۆپی زۆری باران -->
    <div class="raindrop" style="left: 5%; width: 2px; height: 20px; animation-duration: 1.8s;"></div>
    <div class="raindrop" style="left: 15%; width: 3px; height: 28px; animation-duration: 2.2s;"></div>
    <div class="raindrop" style="left: 25%; width: 2px; height: 22px; animation-duration: 1.5s;"></div>
    <div class="raindrop" style="left: 35%; width: 3px; height: 30px; animation-duration: 2.5s;"></div>
    <div class="raindrop" style="left: 45%; width: 2px; height: 18px; animation-duration: 1.9s;"></div>
    <div class="raindrop" style="left: 55%; width: 3px; height: 25px; animation-duration: 2.1s;"></div>
    <div class="raindrop" style="left: 65%; width: 2px; height: 22px; animation-duration: 1.6s;"></div>
    <div class="raindrop" style="left: 75%; width: 3px; height: 27px; animation-duration: 2.3s;"></div>
    <div class="raindrop" style="left: 85%; width: 2px; height: 20px; animation-duration: 1.7s;"></div>
    <div class="raindrop" style="left: 95%; width: 3px; height: 26px; animation-duration: 2.0s;"></div>

    <div class="center-box">
        <h1>ڕۆژی لەدایک بونی ئازیزەکانم <br> هەرگیز ڕۆژی لەدایک بونتان لە یاد ناکەم ئێوەم هەردەم خۆش دەوێ</h1>
        <button onclick="playMusic()">لێدانی موزیک 🎵</button>
    </div>

    <!-- ناوەکان، دڵەکان و مۆلیدەکان -->
    <div class="item-container pos1">
        <div class="name">💖 باپیرە گیان 💖</div>
        <div class="date">18\5\1866</div>
    </div>
    
    <div class="item-container pos2">
        <div class="name">❤️ نەنە گیان ❤️</div>
        <div class="date">2\1\1969</div>
    </div>

    <div class="item-container pos3">
        <div class="name">💗 خاڵە دیار 💗</div>
        <div class="date">11\7\2004</div>
    </div>

    <div class="item-container pos4">
        <div class="name">💓 خاڵە دابان 💓</div>
        <div class="date">8\5\1995</div>
    </div>

    <div class="item-container pos5">
        <div class="name">💕 پورە ئاڤان 💕</div>
        <div class="date">19\11\1999</div>
    </div>

    <div class="item-container pos6">
        <div class="name">💞 دادە لاڤە 💞</div>
        <div class="date">هیچ داتابەیسێک نیە</div>
    </div>

    <!-- کەنار دەریا لە خوارەوە -->
    <div class="sea-shore"></div>

    <!-- موزیکی Snowfall -->
    <audio id="myAudio" loop>
        <source src="https://cdnsongs.com/music/data/Single_Track/202211/Snowfall/128/Snowfall_1.mp3" type="audio/mpeg">
    </audio>

    <script>
        function playMusic() {
            var audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>

</body>
</html>
