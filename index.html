<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ئازیزەکانم</title>
    <style>
        body {
            background: linear-gradient(135deg, #120016, #2d0b23, #080112);
            font-family: 'Tahoma', sans-serif;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* مانگ لە گۆشەدا */
        .moon {
            position: absolute;
            top: 30px;
            left: 40px;
            width: 70px;
            height: 70px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 30px #ffeb3b, 0 0 60px rgba(255, 235, 59, 0.5);
            z-index: 1;
        }
        /* ئەستێرەکان و دڵەکان لە باگراونددا */
        .bg-element {
            position: absolute;
            pointer-events: none;
            opacity: 0.6;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 0.9; transform: scale(1.1); }
        }

        .center-box {
            position: absolute;
            z-index: 10;
            text-align: center;
        }
        h1 {
            color: #ff758c;
            font-size: 30px;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.8);
            margin-bottom: 10px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* جووڵەی ناوەکان */
        .floating-item {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            text-align: center;
        }
        .date {
            font-size: 16px;
            color: #ffeb3b;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(255, 235, 59, 0.6);
        }

        @keyframes moveRight {
            0% { left: -250px; }
            100% { left: 105vw; }
        }
        @keyframes moveLeft {
            0% { right: -250px; }
            100% { right: 105vw; }
        }
        @keyframes colorGlow {
            0% { color: #ff758c; text-shadow: 0 0 10px #ff758c; }
            50% { color: #ffffff; text-shadow: 0 0 15px #ffffff; }
            100% { color: #ff3838; text-shadow: 0 0 10px #ff3838; }
        }

        .i1 { top: 12%; animation: moveRight 8s linear infinite, colorGlow 3s infinite; }
        .i2 { top: 28%; animation: moveLeft 10s linear infinite, colorGlow 3s infinite; }
        .i3 { top: 44%; animation: moveRight 7s linear infinite, colorGlow 3s infinite; }
        .i4 { top: 60%; animation: moveLeft 9s linear infinite, colorGlow 3s infinite; }
        .i5 { top: 76%; animation: moveRight 11s linear infinite, colorGlow 3s infinite; }
        .i6 { top: 88%; animation: moveLeft 8s linear infinite, colorGlow 3s infinite; }
    </style>
</head>
<body>

    <!-- مانگ -->
    <div class="moon"></div>

    <!-- دڵ و ئەستێرەی باگراوند -->
    <div class="bg-element" style="top: 10%; right: 15%; font-size: 24px;">⭐</div>
    <div class="bg-element" style="top: 20%; right: 30%; font-size: 20px; color: #ff758c;">❤️</div>
    <div class="bg-element" style="top: 70%; right: 10%; font-size: 28px; color: #ff6b81;">💖</div>
    <div class="bg-element" style="top: 80%; left: 20%; font-size: 22px;">⭐</div>
    <div class="bg-element" style="top: 30%; left: 15%; font-size: 26px; color: #ff4757;">❤️</div>
    <div class="bg-element" style="top: 55%; left: 25%; font-size: 18px;">✨</div>
    <div class="bg-element" style="top: 15%; left: 40%; font-size: 22px; color: #ff758c;">💗</div>

    <div class="center-box">
        <h1>✨ ئازیزەکانم ✨</h1>
        <button onclick="playMusic()">لێدانی موزیک 🎵</button>
    </div>

    <!-- ناوەکان و بەروارەکان -->
    <div class="floating-item i1">
        <div>باپیرە گیان</div>
        <div class="date">18\5\1866</div>
    </div>
    <div class="floating-item i2">
        <div>نەنە گیان</div>
        <div class="date">2\1\1969</div>
    </div>
    <div class="floating-item i3">
        <div>خاڵە دیار</div>
        <div class="date">11\7\2004</div>
    </div>
    <div class="floating-item i4">
        <div>خاڵە دابان</div>
        <div class="date">8\5\1995</div>
    </div>
    <div class="floating-item i5">
        <div>پورە ئاڤان</div>
        <div class="date">19\11\1999</div>
    </div>
    <div class="floating-item i6">
        <div>دادە لاڤە</div>
        <div class="date">هیچ داتابەیسێک نیە</div>
    </div>

    <audio id="myAudio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        function playMusic() {
            var audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>

</body>
</html>
