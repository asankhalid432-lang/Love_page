<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیرۆزبایی</title>
    <style>
        body {
            background-color: #fce4ec;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        h1 { color: #d81b60; font-size: 26px; }
        .names {
            font-size: 20px;
            color: #4a148c;
            line-height: 2.2;
            margin: 30px 0;
            font-weight: bold;
        }
        .footer {
            margin-top: 50px;
            font-size: 18px;
            color: #555;
            font-style: italic;
        }
        .heart { color: red; font-size: 30px; }
    </style>
</head>
<body>

    <h1>ڕۆژی لەدایک بوونتان پیرۆز بێت خێزانە جوانەکەی من</h1>
    
    <div class="names">
        خاڵە دابان<br>
        پورە ئاڤان<br>
        خاڵە دییار<br>
        دادە لاڤە<br>
        دایە <span class="heart">❤️</span><br>
        باوە <span class="heart">❤️</span>
    </div>

    <div class="footer">
        ئەگەر ڕۆژی لەدایک بوونتان نزیکە، ئەمە دیارییەکی بچووکە پێشکەشتان بێت
    </div>

</body>
</html>
