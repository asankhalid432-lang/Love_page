<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ڕۆژی لەدایک بونی ئازیزەکانم</title>
    <style>
        body {
            background: linear-gradient(180deg, #05051a, #0b1d3a, #102a45);
            font-family: 'Tahoma', sans-serif;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* مانگی گەورە لە گۆشەدا */
        .moon {
            position: absolute;
            top: 20px;
            right: 30px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e0e0e0 60%, #b0b0b0 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.8), inset -12px -12px 20px rgba(0,0,0,0.3);
            z-index: 1;
        }
        .moon::after {
            content: "";
            position: absolute;
            top: 25px;
            left: 30px;
            width: 30px;
            height: 25px;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 50% 40% 60% 40%;
            box-shadow: 25px 20px 0 5px rgba(0, 0, 0, 0.1);
        }

        /* نەیزەک */
        .meteor {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, white, transparent);
            transform: rotate(45deg);
            animation: shootMeteor 5s linear infinite;
            z-index: 2;
        }
        @keyframes shootMeteor {
            0% { top: -50px; left: -50px; opacity: 1; }
            30% { top: 40vh; left: 40vw; opacity: 1; }
            100% { top: 105vh; left: 105vw; opacity: 0; }
        }

        /* کەنار دەریا لە خوارەوە */
        .sea-shore {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(0deg, #023e8a, #0077b6, rgba(0,119,182,0.4));
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
            box-shadow: 0 -5px 25px rgba(0, 119, 182, 0.6);
            z-index: 2;
        }

        /* ئەستێرەکان */
        .star {
            position: absolute;
            z-index: 1;
            animation: twinkleStar 2.5s infinite alternate;
        }
        @keyframes twinkleStar {
            0% { opacity: 0.2; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* دڵۆپی باران */
        .raindrop {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: rainFall linear infinite;
        }
        @keyframes rainFall {
            0% { transform: translateY(-30px); }
            100% { transform: translateY(105vh); }
        }

        .center-box {
            position: absolute;
            top: 15px;
            z-index: 10;
            text-align: center;
            width: 90%;
        }
        h1 {
            color: #7ef9ff;
            font-size: 15px;
            text-shadow: 0 0 10px rgba(126, 249, 255, 0.7);
            line-height: 1.4;
            margin-bottom: 4px;
        }
        .creator {
            font-size: 12px;
            color: #ff9ff3;
            margin-bottom: 6px;
            text-shadow: 0 0 8px rgba(255, 159, 243, 0.8);
        }
        button {
            padding: 5px 14px;
            font-size: 12px;
            cursor: pointer;
            background: #ff3366;
            color: white;
            border: none;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(255,51,102,0.5);
        }

        /* ستیکەرەکان */
        .sticker {
            position: absolute;
            font-size: 26px;
            z-index: 4;
            animation: floatSticker 4s ease-in-out infinite alternate;
            opacity: 0.85;
        }
        @keyframes floatSticker {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-10px) scale(1.1); }
        }

        /* ناوەکان بە لیدی نیۆن و جووڵەی هێواش بەرەو ناوەڕاست */
        .item-container {
            position: absolute;
            text-align: center;
            z-index: 5;
        }
        .name {
            font-size: 26px;
            font-weight: bold;
            animation: neonGlow 4s infinite;
        }
        .date {
            font-size: 14px;
            color: #ffd700;
            margin-top: 2px;
            text-shadow: 0 0 8px rgba(255,215,0,0.8);
        }

        /* لیدی نیۆن کە ڕەنگەکان دەگۆڕێت */
        @keyframes neonGlow {
            0% { color: #ff007f; text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff007f; }
            33% { color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff; }
            66% { color: #bf00ff; text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 40px #bf00ff; }
            100% { color: #ffff00; text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00, 0 0 40px #ffff00; }
        }

        /* شوێنی ناوەکان و جووڵەیان بەرەو ناوەڕاست */
        .pos1 { top: 32%; left: 15%; animation: moveRightToCenter 4s ease-out forwards; }
        .pos2 { top: 32%; right: 15%; animation: moveLeftToCenter 4s ease-out forwards; }
        .pos3 { top: 52%; left: 18%; animation: moveRightToCenter 4.5s ease-out forwards; }
        .pos4 { top: 52%; right: 18%; animation: moveLeftToCenter 4.5s ease-out forwards; }
        .pos5 { top: 72%; left: 20%; animation: moveRightToCenter 5s ease-out forwards; }
        .pos6 { top: 72%; right: 20%; animation: moveLeftToCenter 5s ease-out forwards; }

        @keyframes moveRightToCenter {
            0% { transform: translateX(-80px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes moveLeftToCenter {
            0% { transform: translateX(80px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- مانگ و نەیزەک -->
    <div class="moon"></div>
    <div class="meteor"></div>

    <!-- ستیکەرەکان -->
    <div class="sticker" style="top: 15%; left: 10%;">🧸❤️</div>
    <div class="sticker" style="top: 25%; left: 80%;">🎂</div>
    <div class="sticker" style="top: 60%; left: 5%;">🎁</div>
    <div class="sticker" style="top: 75%; left: 85%;">🧸❤️</div>
    <div class="sticker" style="top: 40%; left: 90%;">🎈</div>

    <!-- ئەستێرەکان -->
    <div class="star" style="top: 10%; left: 20%; width: 5px; height: 5px; background: #9b59b6; border-radius: 50%;"></div>
    <div class="star" style="top: 18%; left: 40%; width: 8px; height: 4px; background: #fff;"></div>
    <div class="star" style="top: 35%; left: 10%; width: 6px; height: 6px; background: #e8daef; border-radius: 50%;"></div>

    <!-- دڵۆپی باران -->
    <div class="raindrop" style="left: 15%; width: 2px; height: 20px; animation-duration: 1.8s;"></div>
    <div class="raindrop" style="left: 35%; width: 3px; height: 25px; animation-duration: 2.2s;"></div>
    <div class="raindrop" style="left: 65%; width: 2px; height: 18px; animation-duration: 1.5s;"></div>
    <div class="raindrop" style="left: 85%; width: 3px; height: 22px; animation-duration: 2.5s;"></div>

    <div class="center-box">
        <h1>ڕۆژی لەدایک بونی ئازیزەکانم <br> هەرگیز ڕۆژی لەدایک بونتان لە یاد ناکەم ئێوەم هەردەم خۆش دەوێ</h1>
        <div class="creator">✨ دروستکراوە لەلایەن ئاسان ✨</div>
        <button onclick="playMusic()">لێدانی موزیک 🎵</button>
    </div>

    <!-- ناوەکان و بەروارەکان -->
    <div class="item-container pos1">
        <div class="name">باپیرە گیان</div>
        <div class="date">18\5\1866</div>
    </div>
    
    <div class="item-container pos2">
        <div class="name">نەنە گیان</div>
        <div class="date">2\1\1969</div>
    </div>

    <div class="item-container pos3">
        <div class="name">خاڵە دیار</div>
        <div class="date">11\7\2004</div>
    </div>

    <div class="item-container pos4">
        <div class="name">خاڵە دابان</div>
        <div class="date">8\5\1995</div>
    </div>

    <div class="item-container pos5">
        <div class="name">پورە ئاڤان</div>
        <div class="date">19\11\1999</div>
    </div>

    <div class="item-container pos6">
        <div class="name">دادە لاڤە</div>
        <div class="date">هیچ داتابەیسێک نیە</div>
    </div>

    <!-- کەنار دەریا -->
    <div class="sea-shore"></div>

    <!-- موزیک -->
    <audio id="myAudio" loop>
        <source src="https://cdnsongs.com/music/data/Single_Track/202211/Snowfall/128/Snowfall_1.mp3" type="audio/mpeg">
    </audio>

    <script>
        function playMusic() {
            var audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>

</body>
</html>
